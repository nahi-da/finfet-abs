<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinFeT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/parts.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <button type="button" class="icon-btn" id="nav-toggle" aria-label="ナビゲーションの表示を切り替え" title="ナビゲーションの表示を切り替え"><span class="icon icon-nav i20"></span></button>
    <a class="app-name" href="/jobs">FinFeT</a>
    <span class="demo-label" id="demo-label" hidden>デモモード</span>
    <span class="spacer"></span>
    <span class="conn-lost" id="conn-lost" hidden>本ツールに接続できません（本ツールが終了した可能性があります）</span>
    <button type="button" class="link-btn" id="notices-btn">お知らせ</button>
    <button type="button" class="link-btn" id="account-btn">アカウント</button>
  </header>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="ナビゲーション">
      <a href="/search" data-nav="search" title="検索"><span class="icon icon-search i20" aria-hidden="true"></span><span class="nav-text">検索</span></a>
      <a href="/jobs" data-nav="jobs" title="ジョブ"><span class="icon icon-jobs i20" aria-hidden="true"></span><span class="nav-text">ジョブ</span><span class="count" id="nav-jobs-count"></span></a>
      <a href="/history" data-nav="history" title="検索履歴"><span class="icon icon-history i20" aria-hidden="true"></span><span class="nav-text">検索履歴</span></a>
      <a href="/connections" data-nav="connections" title="接続"><span class="icon icon-connections i20" aria-hidden="true"></span><span class="nav-text">接続</span></a>
      <a href="/settings" data-nav="settings" title="設定"><span class="icon icon-settings i20" aria-hidden="true"></span><span class="nav-text">設定</span></a>
      <div class="nav-bottom">
        <a href="/docs/index.html" target="_blank" rel="noopener" title="ヘルプ（別のタブで開きます）"><span class="icon icon-help i20" aria-hidden="true"></span><span class="nav-text">ヘルプ</span><span class="icon icon-external" aria-hidden="true"></span></a>
      </div>
    </nav>
    <main class="page" id="page"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
