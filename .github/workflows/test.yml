name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-repo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: リポジトリの検査
        run: python -X utf8 tools/check_repo.py

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: 依存パッケージの導入
        run: "python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r setup/requirements.txt"
      - name: 単体テスト
        env:
          PYTHONPATH: src
        run: python -X utf8 -m unittest discover -s tests -t . -v
